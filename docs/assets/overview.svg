<circle cx="12" cy="97" r="5" fill="#85baff"/><text x="36" y="104" font-size="20" fill="#dbe5f1">Respect the usage budget</text>
<circle cx="12" cy="138" r="5" fill="#7edcb5"/><text x="36" y="145" font-size="20" fill="#dbe5f1">Update one title prefix</text>
</g></g></svg>